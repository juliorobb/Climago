name: Refresh official SMN CAP alerts
on:
  push:
    branches: [main, feature/alertas-smn-estables-v1, release/smn-alerts-radar-2026-11-05, work/smn-cap-parser-geo-complete-2026-11-16]
    paths:
      - ".github/workflows/smn-alerts-refresh.yml"
      - "scripts/refresh_smn_alerts.py"
      - "app.js"
      - "service-worker.js"
      - "index.html"
      - "styles.css"
      - "tests/test_refresh_smn_alerts.py"
  pull_request:
    branches: [main]
  workflow_dispatch:
  # GitHub schedules run from the default branch (main). Keep the hourly cadence to limit load on the SMN.
# Do not use this workflow as per-commit validation on app preview branches.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: climago-smn-alerts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript, Python and CAP regression tests
        run: |
          node --check app.js
          node --check service-worker.js
          python -m py_compile scripts/refresh_smn_alerts.py
          python -m unittest discover -s tests -v
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript and Python before contacting the SMN
        run: |
          node --check app.js
          node --check service-worker.js
          python -m py_compile scripts/refresh_smn_alerts.py
          python -m unittest discover -s tests -v
      - name: Download and normalize official CAP alerts
        run: python scripts/refresh_smn_alerts.py
      - name: Commit refreshed data only when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smn-alerts.json
          git diff --cached --quiet || (git commit -m "Refresh official SMN CAP alerts data" && git push)
      - name: Sync refreshed data to the current app branch
        if: github.ref == 'refs/heads/main'
        env:
          TARGET_BRANCH: pronostico-luna-iconos-detalles
        run: |
          cp data/smn-alerts.json /tmp/smn-alerts.json
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          cp /tmp/smn-alerts.json data/smn-alerts.json
          git add data/smn-alerts.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync official SMN CAP alerts data"
            git push origin "$TARGET_BRANCH"
          fi
