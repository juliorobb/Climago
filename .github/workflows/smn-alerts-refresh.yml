name: Refresh SMN CAP alerts
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
concurrency:
  group: smn-alerts-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp-alertas-radar-2026-11-03
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and normalize SMN CAP RSS
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET, os
          from datetime import datetime, timezone
          url = "https://ssl.smn.gob.ar/feeds/CAP/avisocortoplazo/rss_acpCAP.xml"
          req = urllib.request.Request(url, headers={"User-Agent":"ClimaGo/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response: root = ET.fromstring(response.read())
          channel = root.find("./channel")
          items = []
          for item in (channel.findall("item") if channel is not None else []):
              get = lambda name: (item.findtext(name) or "").strip()
              title, link, desc = get("title"), get("link"), get("description")
              if not title or not link.startswith("https://ssl.smn.gob.ar/feeds/CAP/"): continue
              items.append({"title":title,"description":desc,"url":link,"sent":get("pubDate"),
                            "severity":get("category") or "Aviso oficial",
                            "areas":[desc] if desc else [],
                            "affectsCordoba":"córdoba" in (title+" "+desc).lower()})
          items.sort(key=lambda x: (not x["affectsCordoba"], x["sent"]))
          data={"source":"Servicio Meteorológico Nacional · CAP","feed":url,
                "generatedAt":datetime.now(timezone.utc).isoformat(),"feedItems":len(items),"alerts":items[:30]}
          os.makedirs("data",exist_ok=True)
          with open("data/smn-alerts.json","w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2)
          print("Avisos publicados:",len(items))
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smn-alerts.json
          git diff --cached --quiet || (git commit -m "Refresh official SMN CAP alerts data" && git push)
