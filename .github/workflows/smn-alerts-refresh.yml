name: Refresh official SMN CAP alerts
on:
  push:
    branches: [feature/alertas-smn-estables-v1]
    paths:
      - ".github/workflows/smn-alerts-refresh.yml"
      - "scripts/refresh_smn_alerts.py"
  workflow_dispatch:
  # GitHub scheduled workflows run only from the default branch.
  # This hourly schedule becomes active after an approved merge to main.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: climago-smn-alerts-feature
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alertas-smn-estables-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and normalize official CAP alerts
        run: python scripts/refresh_smn_alerts.py
      - name: Commit refreshed data only when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smn-alerts.json
          git diff --cached --quiet || (git commit -m "Refresh official SMN CAP alerts data" && git push)
