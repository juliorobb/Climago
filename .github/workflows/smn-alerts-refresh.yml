name: Refresh official SMN CAP alerts
on:
  push:
    branches: [main, feature/alertas-smn-estables-v1, release/smn-alerts-radar-2026-11-05, pronostico-luna-iconos-detalles, work/alertas-geografia-integracion-2026-11-17]
    paths:
      - ".github/workflows/smn-alerts-refresh.yml"
      - "scripts/refresh_smn_alerts.py"
      - "app.js"
      - "service-worker.js"
      - "index.html"
      - "styles.css"
      - "tests/test_refresh_smn_alerts.py"
      - "tests/test_smn_geography.test.js"
      - "tests/test_smn_service_worker.test.js"
      - "tests/test_push_subscription_compatibility.test.js"
  pull_request:
    paths:
      - ".github/workflows/smn-alerts-refresh.yml"
      - "scripts/refresh_smn_alerts.py"
      - "app.js"
      - "service-worker.js"
      - "index.html"
      - "styles.css"
      - "tests/test_refresh_smn_alerts.py"
      - "tests/test_smn_geography.test.js"
      - "tests/test_smn_service_worker.test.js"
  workflow_dispatch:
  # GitHub schedules run from the default branch (main).
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: climago-smn-alerts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/pronostico-luna-iconos-detalles' || github.ref == 'refs/heads/work/alertas-geografia-integracion-2026-11-17')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/alertas-geografia-integracion-2026-11-17')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate alert code without contacting the SMN
        run: |
          node --check app.js
          node --check service-worker.js
          node --test tests/test_smn_geography.test.js
          node --test tests/test_smn_service_worker.test.js
          node --test tests/test_push_subscription_compatibility.test.js
          python -m py_compile scripts/refresh_smn_alerts.py
          python -m unittest discover -s tests -v

  refresh:
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 14) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/alertas-geografia-integracion-2026-11-17') || (github.event_name != 'pull_request' && github.ref != 'refs/heads/pronostico-luna-iconos-detalles' && github.ref != 'refs/heads/work/alertas-geografia-integracion-2026-11-17')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript and Python before contacting the SMN
        run: |
          node --check app.js
          node --check service-worker.js
          node --test tests/test_smn_geography.test.js
          node --test tests/test_smn_service_worker.test.js
          python -m py_compile scripts/refresh_smn_alerts.py
          python -m unittest discover -s tests -v
      - name: Download and normalize official CAP alerts
        env:
          SMN_CAP_BATCH_SIZE: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 14 && '200' || '12' }}
        run: python scripts/refresh_smn_alerts.py
      - name: Upload generated CAP catalog for PR validation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
        uses: actions/upload-artifact@v4
        with:
          name: smn-cap-catalog-pr14
          path: data/smn-alerts.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit refreshed data only when it changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smn-alerts.json
          git diff --cached --quiet || (git commit -m "Refresh official SMN CAP alerts data" && git push)
