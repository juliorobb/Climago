name: Refresh official SMN CAP alerts
on:
  push:
    branches: [main, feature/alertas-smn-estables-v1]
    paths:
      - ".github/workflows/smn-alerts-refresh.yml"
      - "scripts/refresh_smn_alerts.py"
      - "app.js"
      - "service-worker.js"
      - "index.html"
      - "styles.css"
  workflow_dispatch:
  # GitHub schedules run from the default branch (main).
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: climago-smn-alerts-feature
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript and Python before contacting the SMN
        run: |
          node --check app.js
          node --check service-worker.js
          python -m py_compile scripts/refresh_smn_alerts.py
      - name: Download and normalize official CAP alerts
        run: python scripts/refresh_smn_alerts.py
      - name: Commit refreshed data only when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smn-alerts.json
          git diff --cached --quiet || (git commit -m "Refresh official SMN CAP alerts data" && git push)
