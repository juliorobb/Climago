name: WRF-SMN public data proof of concept

on:
  push:
    branches:
      - test/wrf-smn-poc
    paths:
      - .github/workflows/wrf-smn-poc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific libraries
        run: python -m pip install --upgrade pip boto3 netCDF4 numpy matplotlib

      - name: Find and inspect one public SMN forecast file
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import tempfile
          import boto3
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from botocore import UNSIGNED
          from botocore.config import Config
          from netCDF4 import Dataset

          bucket = "smn-ar-wrf"
          s3 = boto3.client(
              "s3",
              region_name="us-west-2",
              config=Config(signature_version=UNSIGNED)
          )

          now = dt.datetime.now(dt.timezone.utc)
          candidates = []
          for day_offset in range(3):
              day = (now - dt.timedelta(days=day_offset)).date()
              for cycle in ("18", "12", "06", "00"):
                  prefix = (
                      f"DATA/WRF/DET/{day:%Y/%m/%d}/{cycle}/"
                  )
                  try:
                      pager = s3.get_paginator("list_objects_v2")
                      for page in pager.paginate(Bucket=bucket, Prefix=prefix):
                          for obj in page.get("Contents", []):
                              key = obj["Key"]
                              if (
                                  key.endswith(".nc")
                                  and "/WRFDETAR_01H_" in key
                                  and key.endswith(f"_{cycle}_001.nc")
                              ):
                                  candidates.append((obj["LastModified"], key, obj["Size"]))
                  except Exception as exc:
                      print(f"Listing {prefix} failed: {exc}")

          if not candidates:
              raise SystemExit("No se encontró un archivo horario reciente en el bucket público del SMN.")

          candidates.sort(reverse=True)
          modified, key, size = candidates[0]
          print(f"Selected: s3://{bucket}/{key}")
          print(f"Last modified: {modified.isoformat()}")
          print(f"Size bytes: {size}")

          if size > 150_000_000:
              raise SystemExit(f"El archivo supera el límite prudente de prueba: {size} bytes")

          local_path = os.path.join(tempfile.gettempdir(), "smn-wrf-sample.nc")
          s3.download_file(bucket, key, local_path)

          with Dataset(local_path) as ds:
              print("Dimensions:", {k: len(v) for k, v in ds.dimensions.items()})
              print("Variables:", list(ds.variables.keys()))
              required = ("PP", "lat", "lon")
              missing = [name for name in required if name not in ds.variables]
              if missing:
                  raise SystemExit(f"Faltan variables necesarias: {missing}")

              pp = np.ma.asarray(ds.variables["PP"][:]).squeeze()
              lat = np.asarray(ds.variables["lat"][:]).squeeze()
              lon = np.asarray(ds.variables["lon"][:]).squeeze()

              if pp.ndim != 2 or lat.shape != pp.shape or lon.shape != pp.shape:
                  raise SystemExit(
                      f"Dimensiones inesperadas: PP={pp.shape}, lat={lat.shape}, lon={lon.shape}"
                  )

              valid = np.ma.masked_invalid(pp)
              if valid.count() == 0:
                  raise SystemExit("La variable PP no contiene valores válidos.")

              stats = {
                  "source": "SMN WRF-SMN public AWS Open Data bucket",
                  "s3_key": key,
                  "last_modified_utc": modified.isoformat(),
                  "shape": list(pp.shape),
                  "valid_cells": int(valid.count()),
                  "precip_min_mm": float(valid.min()),
                  "precip_max_mm": float(valid.max()),
                  "lat_min": float(np.nanmin(lat)),
                  "lat_max": float(np.nanmax(lat)),
                  "lon_min": float(np.nanmin(lon)),
                  "lon_max": float(np.nanmax(lon)),
                  "units": getattr(ds.variables["PP"], "units", "not declared"),
              }
              print("DATA_CHECK:", json.dumps(stats, ensure_ascii=False))

              fig, ax = plt.subplots(figsize=(10, 8))
              mesh = ax.pcolormesh(
                  lon, lat, valid,
                  shading="auto", cmap="turbo",
                  vmin=0, vmax=max(float(valid.max()), 1.0)
              )
              ax.set_title("SMN WRF-SMN · Precipitación pronosticada (PP)")
              ax.set_xlabel("Longitud")
              ax.set_ylabel("Latitud")
              fig.colorbar(mesh, ax=ax, label="Precipitación (mm)")
              fig.tight_layout()
              fig.savefig("wrf-smn-precip-proof.png", dpi=140)
              plt.close(fig)

              with open("wrf-smn-proof.json", "w", encoding="utf-8") as f:
                  json.dump(stats, f, ensure_ascii=False, indent=2)

          print("SUCCESS: archivo NetCDF real descargado, leído y convertido en una imagen de prueba.")
          PY

      - name: Upload proof image and metadata
        uses: actions/upload-artifact@v4
        with:
          name: wrf-smn-proof
          path: |
            wrf-smn-precip-proof.png
            wrf-smn-proof.json
          if-no-files-found: error
